name: CI

on:
  push:
    branches: [main, master, v1]
  pull_request:
    branches: [main, master, v1]

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papergenerator
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: papergenerator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U papergenerator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . --select E,F,W,I --ignore E501 || true   # warn-only initially

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://papergenerator:testpass@localhost:5432/papergenerator
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-jwt-secret-not-real-for-tests-only-32chars
          SECRET_KEY: ci-secret-not-real-for-tests-only-32chars
          SIGNED_URL_SECRET: ci-signed-url-secret-not-real
          OPENAI_API_KEY: sk-ci-fake
          AIOTOMASI_APIKEY: ci-fake
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest tests/ -q

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Vitest unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ''
          VITE_TURNSTILE_SITE_KEY: ''
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papergenerator
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: papergenerator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U papergenerator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://papergenerator:testpass@localhost:5432/papergenerator
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-jwt-secret-not-real-for-tests-only-32chars
      SECRET_KEY: ci-secret-not-real-for-tests-only-32chars
      SIGNED_URL_SECRET: ci-signed-url-secret-not-real
      ENABLE_CAPTCHA: 'true'
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      OPENAI_API_KEY: sk-ci-fake
      AIOTOMASI_APIKEY: ci-fake
      BACKEND_PORT: '8001'
      FRONTEND_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: backend/requirements.txt }

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build frontend (dev mode for Playwright)
        working-directory: frontend
        env:
          VITE_API_URL: ''
          VITE_TURNSTILE_SITE_KEY: ''
        run: npm run build

      - name: Start backend (gunicorn)
        working-directory: backend
        run: |
          nohup gunicorn -c gunicorn.conf.py app:app > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/health && break
            sleep 1
          done

      - name: Start frontend proxy
        working-directory: frontend
        run: |
          nohup node proxy-server.cjs > /tmp/frontend.log 2>&1 &
          for i in {1..15}; do
            curl -sf http://localhost:8000/ -o /dev/null && break
            sleep 1
          done

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: Dump backend + frontend logs on failure
        if: failure()
        run: |
          echo "==================== /tmp/backend.log ===================="
          tail -200 /tmp/backend.log || true
          echo "==================== /tmp/frontend.log ===================="
          tail -100 /tmp/frontend.log || true
          echo "==================== curl /api/health ===================="
          curl -sv http://localhost:8001/api/health || true
          echo "==================== curl /api/auth/register ===================="
          curl -sv -X POST http://localhost:8001/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"x","email":"y@y.local","password":"E2eStrongPass123!","captcha_token":"1x00000000000000000000AA"}' || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  contract:
    name: API Contract (Schemathesis)
    runs-on: ubuntu-22.04
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papergenerator
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: papergenerator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U papergenerator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://papergenerator:testpass@localhost:5432/papergenerator
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-jwt-secret-not-real-for-tests-only-32chars
      SECRET_KEY: ci-secret-not-real-for-tests-only-32chars
      SIGNED_URL_SECRET: ci-signed-url-secret-not-real
      OPENAI_API_KEY: sk-ci-fake
      AIOTOMASI_APIKEY: ci-fake

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: backend/requirements.txt }

      - name: Install backend + schemathesis
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt schemathesis

      - name: Start backend
        working-directory: backend
        run: |
          nohup gunicorn -c gunicorn.conf.py app:app > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/health && break
            sleep 1
          done

      - name: Run Schemathesis (auth endpoints + public read)
        working-directory: backend
        # Limit to read-only and auth endpoints — full coverage requires
        # session fixtures we'd need to inject; smoke gives us schema/200 sanity.
        run: |
          schemathesis run \
            --base-url http://localhost:8001 \
            --checks all \
            --hypothesis-max-examples=20 \
            --hypothesis-deadline=5000 \
            --request-timeout=10000 \
            --include-path '/api/health' \
            --include-path '/api/healthz' \
            --include-path '/api/openapi.yaml' \
            openapi.yaml || true   # warn-only initially
