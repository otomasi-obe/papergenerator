<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperFull Word</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="hd">
      <div class="hd-title"><span class="logo">◆</span> PaperFull Word</div>
      <button id="btnSettings" class="icon-btn" title="Pengaturan">⚙</button>
    </header>

    <!-- Scope selector -->
    <div class="scope-bar">
      <label>Sumber:</label>
      <select id="scopeSel">
        <option value="selection">Teks terpilih</option>
        <option value="paragraph">Paragraf saat ini</option>
        <option value="document">Seluruh dokumen</option>
        <option value="none">Tanpa konteks (chat)</option>
      </select>
      <span id="wordCount" class="wc"></span>
    </div>

    <!-- Quick actions -->
    <div id="actions" class="actions"></div>

    <!-- Chat / output area -->
    <div id="chat" class="chat"></div>

    <!-- Apply controls (muncul setelah ada hasil) -->
    <div id="applyBar" class="apply-bar hidden">
      <button data-apply="docFormatted" class="apply-btn primary">📄 Tulis ke dokumen (format)</button>
      <button data-apply="appendFormatted" class="apply-btn">⬇ Sisip terformat</button>
      <button data-apply="replace" class="apply-btn">↹ Ganti seleksi (teks)</button>
      <button data-apply="redline" class="apply-btn">✓ Track changes</button>
      <button data-apply="copy" class="apply-btn">⧉ Salin</button>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <textarea id="userInput" rows="2" placeholder="Tulis instruksi atau pertanyaan..."></textarea>
      <button id="btnSend" class="send-btn">➤</button>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h3>Pengaturan API</h3>
      <label>Base URL</label>
      <input id="cfgBaseUrl" type="text" placeholder="https://ai.otomasi.app/v1" />
      <label>API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-..." />
      <label>Model</label>
      <div class="row">
        <select id="cfgModelSel"><option value="">— pilih —</option></select>
        <button id="btnLoadModels" class="mini-btn">↻ Muat</button>
      </div>
      <input id="cfgModel" type="text" placeholder="atau ketik nama model manual" />
      <label>Temperature: <span id="tempVal">0.7</span></label>
      <input id="cfgTemp" type="range" min="0" max="1" step="0.1" value="0.7" />
      <div class="modal-actions">
        <button id="btnResetCfg" class="mini-btn">Reset default</button>
        <div>
          <button id="btnCancelCfg" class="mini-btn">Batal</button>
          <button id="btnSaveCfg" class="primary-btn">Simpan</button>
        </div>
      </div>
      <p id="cfgStatus" class="cfg-status"></p>
    </div>
  </div>

  <script src="wordApi.js"></script>
  <script src="markdown.js"></script>
  <script src="equation.js"></script>
  <script src="wordTools.js"></script>
  <script src="aiClient.js"></script>
  <script src="prompts.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
