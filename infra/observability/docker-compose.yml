# PaperFull observability stack — local self-hosted
# Run: docker compose -f infra/observability/docker-compose.yml up -d
#
# Components:
#   - prometheus  : metrics scraper, listens :9090
#   - grafana     : dashboards, listens :3000 (default user: admin / admin)
#   - loki        : log aggregator, listens :3100
#   - promtail    : log shipper that tails /home/sirobo/papergenerator/logs/*.log
#   - glitchtip   : Sentry-compatible error tracking, listens :8000 (we map to :8092)
#   - glitchtip-postgres : private postgres for glitchtip
#   - glitchtip-redis    : private redis for glitchtip
#   - glitchtip-worker   : celery worker for glitchtip
#
# All containers are bind-mounted into ./data so state survives 'down -v' on
# the named volumes you keep. Data on host is at infra/observability/data/.

version: "3.9"

networks:
  obs:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  glitchtip-pg:
  glitchtip-redis:

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    networks: [obs]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    networks: [obs]
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    networks: [obs]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    networks: [obs]
    volumes:
      - ../promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /home/sirobo/papergenerator/logs:/varlogs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]

  # GlitchTip — open source, Sentry-compatible error tracking.
  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [obs]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-pg:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [obs]
    volumes:
      - glitchtip-redis:/data

  glitchtip-web:
    image: glitchtip/glitchtip:v4
    restart: unless-stopped
    networks: [obs]
    depends_on: [glitchtip-postgres, glitchtip-redis]
    environment:
      DATABASE_URL: postgres://postgres@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-replace-me-with-openssl-rand-base64-48}
      PORT: "8000"
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: http://localhost:8092
      DEFAULT_FROM_EMAIL: noreply@paperfull.local
      CELERY_WORKER_AUTOSCALE: "1,3"
    ports:
      - "127.0.0.1:8092:8000"

  glitchtip-worker:
    image: glitchtip/glitchtip:v4
    restart: unless-stopped
    networks: [obs]
    depends_on: [glitchtip-postgres, glitchtip-redis]
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://postgres@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-replace-me-with-openssl-rand-base64-48}
