# Prometheus scrape config for PaperFull
# Scrapes:
#   - paper-backend  /api/metrics (Prometheus exposition)
#   - node_exporter   :9100 (optional — install on host)
#   - postgres_exporter :9187 (optional)
#   - redis_exporter  :9121 (optional)

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: paperfull
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paper-backend
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: node
    static_configs:
      - targets:
          - host.docker.internal:9100

  - job_name: postgres
    static_configs:
      - targets:
          - host.docker.internal:9187

  - job_name: redis
    static_configs:
      - targets:
          - host.docker.internal:9121

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
