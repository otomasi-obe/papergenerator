server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # PaperFull JSON-formatted backend logs (observability.py JSONFormatter).
  - job_name: paperfull-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: paper-backend
          __path__: /varlogs/backend*.log

  - job_name: paperfull-frontend
    static_configs:
      - targets: [localhost]
        labels:
          job: paper-frontend
          __path__: /varlogs/frontend*.log

  - job_name: paperfull-worker
    static_configs:
      - targets: [localhost]
        labels:
          job: paper-worker
          __path__: /varlogs/worker*.log

  - job_name: paperfull-gunicorn
    static_configs:
      - targets: [localhost]
        labels:
          job: gunicorn
          __path__: /varlogs/gunicorn-*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+)\s+\S+\s+\S+\s+\[(?P<time>[^\]]+)\]\s+"(?P<method>\S+)\s+(?P<path>\S+)\s+\S+"\s+(?P<status>\d+)\s+(?P<bytes>\S+)'
      - labels:
          method:
          status:
