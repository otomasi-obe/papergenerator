# ============================================================
# SYSTEM TUNING — File descriptor limits for high concurrency
# File: /etc/security/limits.d/99-paperfull.conf
# Apply: sudo cp /home/sirobo/papergenerator/deploy/99-paperfull.conf /etc/security/limits.d/
# Then: sudo sysctl -p /etc/sysctl.d/99-paperfull.conf
# ============================================================

# Soft/hard limits for www-data (nginx) and sirobo (PM2 processes)
www-data    soft    nofile    65535
www-data    hard    nofile    65535
sirobo      soft    nofile    65535
sirobo      hard    nofile    65535
*           soft    nofile    65535
*           hard    nofile    65535

# Max processes
sirobo      soft    nproc     65535
sirobo      hard    nproc     65535
