# ============================================================
# PAPERFULL.APP — High Concurrency Site Config
# File: /etc/nginx/sites-available/paperfull.conf
# Backup: sudo cp /etc/nginx/sites-available/paperfull.conf /etc/nginx/sites-available/paperfull.conf.bak
# Apply:  sudo cp /home/sirobo/papergenerator/deploy/paperfull.conf /etc/nginx/sites-available/paperfull.conf
# Test:   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Upstream with keepalive connection pool
upstream paperfull_backend {
    server 127.0.0.1:8001;
    keepalive 32;               # Pool of 32 idle keepalive connections to backend
}

# Micro-cache zone for GET requests
proxy_cache_path /var/cache/nginx/paperfull levels=1:2 keys_zone=paperfull_cache:10m max_size=100m inactive=5m use_temp_path=off;

server {
    listen 8000;
    server_name paperfull.app www.paperfull.app localhost;

    # === Root & Index ===
    root /home/sirobo/papergenerator/frontend/dist;
    index index.html;

    # === Body Size Limit ===
    client_max_body_size 1100M;

    # === Connection Limit ===
    limit_conn conn_per_ip 100;

    # === Security Headers ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === /api/images/ MUST proxy to Flask (prefix block with ^~ to beat the static regex below) ===
    # Without this, the static-asset regex ~* \.jpg$ catches /api/images/<pid>/<file>.jpg
    # and tries to serve it from the frontend dist dir → 404.
    location ^~ /api/images/ {
        limit_req zone=api_general burst=150 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No caching — images require auth checks
        proxy_cache off;
    }

    # === Static Assets (long cache, no rate limit) ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;          # Don't log static assets
        open_file_cache max=5000 inactive=120s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
    }

    # === Auth endpoints (strict rate limit) ===
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === AI generation endpoints (moderate rate limit) ===
    location /api/generate {
        limit_req zone=api_ai burst=200 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        # Disable buffering for SSE/streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/jobs/ {
        limit_req zone=api_ai burst=200 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

/# === SSE streaming endpoint (paper generation) ===
    # Regex location — takes precedence over generic /api/ prefix block.
    # Critical: long timeout + buffering OFF so silent LLM thinking (>60s)
    # does not trip nginx default 60s read timeout ("network error").
    location ~ ^/api/papers/[^/]+/generate-stream$ {
        limit_req zone=api_ai burst=200 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        # Critical for SSE: no buffering, no cache, chunked passthrough
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # === SSE streaming for SLR jobs ===
    location ~ ^/api/slr/jobs/[^/]+/stream$ {
        limit_req zone=api_general burst=150 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        # Critical for SSE: no buffering, no cache, chunked passthrough
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
    }

    # === General API (relaxed rate limit) ===
    location /api/ {
        limit_req zone=api_general burst=150 nodelay;

        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";    # Enable keepalive to upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Response caching for GET requests (5s micro-cache)
        proxy_cache paperfull_cache;
        # Cache key: use correct JWT cookie name (flask-jwt-extended default = access_token_cookie).
        # Using $cookie_access_token would match a cookie named "access_token" (wrong).
        proxy_cache_key "$scheme$host$request_uri$http_authorization$cookie_access_token_cookie";
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        # Repeat security headers here — nginx add_header in a location block
        # OVERRIDES (does not extend) add_header from the parent server block.
        # Without these, /api/ responses lose X-Frame-Options, X-Content-Type-Options, etc.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # === SPA Fallback ===
    location / {
        try_files $uri $uri/ /index.html;

        # Cache index.html very briefly to allow updates
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # === Health check (no rate limit, no log) ===
    location /api/health {
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # === Block common attack paths ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|orig)$ {
        deny all;
        access_log off;
    }
}
