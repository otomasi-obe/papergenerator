# ============================================================
# PAPERFULL.APP — High Concurrency Site Config
# File: /etc/nginx/sites-available/paperfull.conf
# ============================================================

# Upstream with keepalive connection pool
upstream paperfull_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# Micro-cache zone for GET requests
proxy_cache_path /var/cache/nginx/paperfull levels=1:2 keys_zone=paperfull_cache:10m max_size=100m inactive=5m use_temp_path=off;

server {
    listen 8000;
    server_name paperfull.app www.paperfull.app localhost;

    root /home/sirobo/papergenerator/frontend/dist;
    index index.html;

    client_max_body_size 1100M;
    limit_conn conn_per_ip 100;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/images/ {
        limit_req zone=api_general burst=150 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        open_file_cache max=5000 inactive=120s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
    }

    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/generate {
        limit_req zone=api_ai burst=200 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/jobs/ {
        limit_req zone=api_ai burst=200 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # SSE streaming endpoint (paper generation)
    location ~ ^/api/papers/[^/]+/generate-stream$ {
        limit_req zone=api_ai burst=200 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SSE streaming for SLR jobs
    location ~ ^/api/slr/jobs/[^/]+/stream$ {
        limit_req zone=api_general burst=150 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=api_general burst=150 nodelay;
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cache paperfull_cache;
        proxy_cache_key "$scheme$host$request_uri$http_authorization$cookie_access_token_cookie";
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    location /api/health {
        proxy_pass http://paperfull_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|orig)$ {
        deny all;
        access_log off;
    }
}
