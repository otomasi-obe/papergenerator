# ============================================================
# KERNEL TUNING — High concurrency networking
# File: /etc/sysctl.d/99-paperfull.conf
# Apply: sudo cp /home/sirobo/papergenerator/deploy/99-paperfull-sysctl.conf /etc/sysctl.d/99-paperfull.conf
# Then:  sudo sysctl -p /etc/sysctl.d/99-paperfull.conf
# ============================================================

# === TCP Backlog ===
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535

# === TCP SYN ===
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3

# === TCP Connection Reuse ===
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 1024 65535

# === TCP Keepalive ===
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# === TCP Fin Timeout ===
net.ipv4.tcp_fin_timeout = 15

# === File Descriptors ===
fs.file-max = 1000000

# === Conntrack (for iptables/nftables) ===
net.netfilter.nf_conntrack_max = 1048576

# === Buffer Sizes ===
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
