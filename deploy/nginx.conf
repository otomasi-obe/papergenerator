# ============================================================
# NGINX GLOBAL CONFIG — High Concurrency Tuning
# File: /etc/nginx/nginx.conf
# Backup original: sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
# Apply: sudo cp /home/sirobo/papergenerator/deploy/nginx.conf /etc/nginx/nginx.conf
# Test: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

user www-data;
worker_processes auto;          # = 40 cores
worker_rlimit_nofile 65535;     # Max open files per worker
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;    # 40 workers × 4096 = 163,840 max connections
    multi_accept on;            # Accept multiple connections at once
    use epoll;                  # Best for Linux high-concurrency
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # Connection handling
    keepalive_timeout 65;
    keepalive_requests 1000;    # Allow 1000 req per keepalive connection
    client_body_timeout 300;
    client_header_timeout 120;
    send_timeout 300;
    reset_timedout_connection on;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # File descriptor & buffer tuning
    ##
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    ##
    # Proxy buffer tuning (for API responses)
    ##
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_connect_timeout 1800;
    proxy_read_timeout 1800;
    proxy_send_timeout 1800;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ##
    # Gzip Compression
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    ##
    # Rate Limiting Zones
    ##
    # General API: 100 req/s per IP (burst 150)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
    # Login/auth: 5 req/s per IP (burst 10) — anti-brute-force
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    # AI generation: 50 req/s per IP (burst 200) — supports concurrent chat/streaming
    limit_req_zone $binary_remote_addr zone=api_ai:10m rate=50r/s;

    # Connection limit: max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    ##
    # Logging Settings
    ##
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ##
    # Open file cache (avoid stat() on every request)
    ##
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
