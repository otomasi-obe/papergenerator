<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 14px; }
  .grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 9px; }
  .i { background: var(--cream-100); border: 1px solid var(--cream-300); border-radius: var(--radius-sm); padding: 8px 4px; text-align:center; }
  .i .e { font-size: 19px; line-height: 1.3; }
  .i .l { font-size: 9.5px; color: var(--ink-600); }
</style>
</head>
<body>
  <div class="cap">Emoji — the primary "icon set"</div>
  <div class="sub">Tabs, menus &amp; status · always aria-hidden beside a text label</div>
  <div class="grid">
    <div class="i"><div class="e">📝</div><div class="l">Editor</div></div>
    <div class="i"><div class="e">📚</div><div class="l">Journal</div></div>
    <div class="i"><div class="e">📖</div><div class="l">Literatur</div></div>
    <div class="i"><div class="e">📂</div><div class="l">Files</div></div>
    <div class="i"><div class="e">📊</div><div class="l">Data</div></div>
    <div class="i"><div class="e">👁</div><div class="l">Preview</div></div>
    <div class="i"><div class="e">💬</div><div class="l">AI Chat</div></div>
    <div class="i"><div class="e">📄</div><div class="l">DOCX</div></div>
    <div class="i"><div class="e">💡</div><div class="l">Saran</div></div>
    <div class="i"><div class="e">📤</div><div class="l">Upload</div></div>
    <div class="i"><div class="e">☀️</div><div class="l">Light</div></div>
    <div class="i"><div class="e">🌙</div><div class="l">Dark</div></div>
  </div>
</body>
</html>
