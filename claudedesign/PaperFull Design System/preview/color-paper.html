<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; box-sizing: border-box; }
  .sw .n { font-size: 11px; font-weight: 600; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .85; }
  .cap { display:flex; align-items:baseline; gap:8px; margin: 0 0 12px; }
  .cap b { font-size: 14px; color: var(--fg-strong); font-weight: 700; }
  .cap span { font-size: 12px; color: var(--fg-muted); }
  .grp { margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="grp">
    <div class="cap"><b>Ivory — Kertas Tua</b><span>"physical paper" surfaces</span></div>
    <div class="row">
      <div class="sw" style="background:var(--ivory-50); color:#5e4a35"><span class="n">50</span><span class="h">fffdfa</span></div>
      <div class="sw" style="background:var(--ivory-100); color:#5e4a35"><span class="n">100</span><span class="h">fbf8f1</span></div>
      <div class="sw" style="background:var(--ivory-200); color:#5e4a35"><span class="n">200</span><span class="h">f4edde</span></div>
      <div class="sw" style="background:var(--ivory-300); color:#3b2e22"><span class="n">300</span><span class="h">e3d8c2</span></div>
      <div class="sw" style="background:var(--ivory-400); color:#fff"><span class="n">400</span><span class="h">c9b595</span></div>
      <div class="sw" style="background:var(--ivory-500); color:#fff"><span class="n">500</span><span class="h">a38560</span></div>
    </div>
  </div>
  <div class="grp">
    <div class="cap"><b>Cream — Kertas Sekunder</b><span>app bg = cream-50 · borders = cream-300</span></div>
    <div class="row">
      <div class="sw" style="background:var(--cream-50); color:#624933"><span class="n">50 · app</span><span class="h">fffdf8</span></div>
      <div class="sw" style="background:var(--cream-100); color:#624933"><span class="n">100</span><span class="h">faf5ec</span></div>
      <div class="sw" style="background:var(--cream-200); color:#624933"><span class="n">200</span><span class="h">f1e8d8</span></div>
      <div class="sw" style="background:var(--cream-300); color:#463323"><span class="n">300 · border</span><span class="h">dfcfb5</span></div>
      <div class="sw" style="background:var(--cream-400); color:#fff"><span class="n">400</span><span class="h">c3aa83</span></div>
      <div class="sw" style="background:var(--cream-500); color:#fff"><span class="n">500</span><span class="h">9f7d54</span></div>
    </div>
  </div>
</body>
</html>
