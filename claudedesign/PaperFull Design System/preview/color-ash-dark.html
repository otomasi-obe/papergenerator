<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: #0b1f3e; font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .sw { flex: 1; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; box-sizing: border-box; }
  .sw .n { font-size: 11px; font-weight: 600; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .85; }
  .cap { display:flex; align-items:baseline; gap:8px; margin: 0 0 12px; }
  .cap b { font-size: 14px; color: #f0f5fb; font-weight: 700; }
  .cap span { font-size: 12px; color: #8eb3d8; }
</style>
</head>
<body>
  <div class="cap"><b>Ash — Nautical Blue-Dark</b><span>Dark mode is blue, not gray · primary button flips to cream</span></div>
  <div class="row">
    <div class="sw" style="background:var(--ash-900); color:#d4e4f4"><span class="n">900</span><span class="h">07122a</span></div>
    <div class="sw" style="background:var(--ash-850); color:#d4e4f4"><span class="n">850 · shell</span><span class="h">0b1f3e</span></div>
    <div class="sw" style="background:var(--ash-800); color:#d4e4f4"><span class="n">800 · header</span><span class="h">102c55</span></div>
    <div class="sw" style="background:var(--ash-700); color:#d4e4f4"><span class="n">700 · card</span><span class="h">163d71</span></div>
    <div class="sw" style="background:var(--ash-600); color:#fff"><span class="n">600 · border</span><span class="h">1e518e</span></div>
    <div class="sw" style="background:var(--ash-500); color:#fff"><span class="n">500</span><span class="h">2969ac</span></div>
    <div class="sw" style="background:var(--ash-300); color:#07122a"><span class="n">300</span><span class="h">74a8d8</span></div>
  </div>
</body>
</html>
