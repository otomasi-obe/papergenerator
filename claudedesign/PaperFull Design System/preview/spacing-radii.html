<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 14px; }
  .grid { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .box { background: var(--navy-700); border: 1px solid var(--navy-800); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--fg-strong); margin-top: 8px; }
  .vl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap">Corner radii</div>
  <div class="grid">
    <div class="item"><div class="box" style="width:74px;height:60px;border-radius:6px"></div><div class="nm">sm</div><div class="vl">6px · chips</div></div>
    <div class="item"><div class="box" style="width:74px;height:60px;border-radius:12px"></div><div class="nm">md · xl</div><div class="vl">12px · buttons</div></div>
    <div class="item"><div class="box" style="width:74px;height:60px;border-radius:16px"></div><div class="nm">lg · 2xl</div><div class="vl">16px · cards</div></div>
    <div class="item"><div class="box" style="width:74px;height:60px;border-radius:24px"></div><div class="nm">xl · 3xl</div><div class="vl">24px · panels</div></div>
    <div class="item"><div class="box" style="width:74px;height:60px;border-radius:9999px"></div><div class="nm">pill</div><div class="vl">full · badges</div></div>
  </div>
</body>
</html>
