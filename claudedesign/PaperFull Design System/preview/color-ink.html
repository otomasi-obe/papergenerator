<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw { flex: 1; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; box-sizing: border-box; }
  .sw .n { font-size: 11px; font-weight: 600; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .85; }
  .cap { display:flex; align-items:baseline; gap:8px; margin: 0 0 12px; }
  .cap b { font-size: 14px; color: var(--fg-strong); font-weight: 700; }
  .cap span { font-size: 12px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap"><b>Ink — Cool Blue-Gray</b><span>headings = ink-900 · body = ink-700 · muted = ink-500</span></div>
  <div class="row">
    <div class="sw" style="background:var(--ink-50); color:#162d56"><span class="n">50</span><span class="h">f0f5fb</span></div>
    <div class="sw" style="background:var(--ink-100); color:#162d56"><span class="n">100</span><span class="h">dce8f5</span></div>
    <div class="sw" style="background:var(--ink-300); color:#0c1c3c"><span class="n">300</span><span class="h">8eb3d8</span></div>
    <div class="sw" style="background:var(--ink-500); color:#fff"><span class="n">500 · muted</span><span class="h">3e70a8</span></div>
    <div class="sw" style="background:var(--ink-700); color:#fff"><span class="n">700 · body</span><span class="h">214070</span></div>
    <div class="sw" style="background:var(--ink-800); color:#fff"><span class="n">800</span><span class="h">162d56</span></div>
    <div class="sw" style="background:var(--ink-900); color:#fff"><span class="n">900 · head</span><span class="h">0c1c3c</span></div>
  </div>
</body>
</html>
