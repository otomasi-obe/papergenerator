<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw { flex: 1; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; box-sizing: border-box; }
  .sw .n { font-size: 11px; font-weight: 600; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .85; }
  .cap { display:flex; align-items:baseline; gap:8px; margin: 0 0 12px; }
  .cap b { font-size: 14px; color: var(--fg-strong); font-weight: 700; }
  .cap span { font-size: 12px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap"><b>Gold — Emas Antik</b><span>Sparingly: premium / "accepted" badges, stars, decorative rules</span></div>
  <div class="row">
    <div class="sw" style="background:var(--gold-50); color:#845b0d"><span class="n">50</span><span class="h">fefaec</span></div>
    <div class="sw" style="background:var(--gold-100); color:#845b0d"><span class="n">100</span><span class="h">faf0c6</span></div>
    <div class="sw" style="background:var(--gold-200); color:#654208"><span class="n">200</span><span class="h">f5de87</span></div>
    <div class="sw" style="background:var(--gold-300); color:#452c04"><span class="n">300</span><span class="h">ecc440</span></div>
    <div class="sw" style="background:var(--gold-400); color:#fff"><span class="n">400 · star</span><span class="h">d9a718</span></div>
    <div class="sw" style="background:var(--gold-500); color:#fff"><span class="n">500 · label</span><span class="h">c28d0d</span></div>
    <div class="sw" style="background:var(--gold-700); color:#fff"><span class="n">700</span><span class="h">845b0d</span></div>
  </div>
</body>
</html>
