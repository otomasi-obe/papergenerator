<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; width: 300px; }
  .card .body { padding: 18px 18px 12px; }
  .card h3 { font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink-900); margin: 0 0 10px; line-height: 1.35; }
  .chips { display:flex; flex-wrap:wrap; gap: 6px; }
  .chip { font-size: 11px; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--cream-100); color: var(--ink-600); }
  .acts { display:flex; gap: 8px; padding: 0 16px 16px; }
  .b { border: 0; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; padding: 8px 10px; cursor: pointer; }
  .open { flex: 1; background: var(--navy-700); color: var(--cream-50); }
  .copy { background: var(--cream-200); color: var(--ink-900); }
  .del { background: rgba(196,54,85,.08); color: #a52d48; }
</style>
</head>
<body>
  <div class="cap">Paper card — dashboard</div>
  <article class="card">
    <div class="body">
      <h3>Adaptive Sliding-Mode Control for a Two-Wheeled Self-Balancing Robot</h3>
      <div class="chips">
        <span class="chip">Updated 3h ago</span>
        <span class="chip">🖼️ 4 images</span>
        <span class="chip">IEEE RA-L</span>
        <span class="chip">6 sections</span>
      </div>
    </div>
    <div class="acts">
      <button class="b open">Open</button>
      <button class="b copy">Copy</button>
      <button class="b del">Delete</button>
    </div>
  </article>
</body>
</html>
