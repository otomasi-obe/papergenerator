<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-panel); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 14px; }
  .msgs { display:flex; flex-direction:column; gap: 10px; margin-bottom: 14px; }
  .b { max-width: 78%; padding: 10px 13px; font-size: 13px; line-height: 1.5; border-radius: 14px; }
  .user { align-self: flex-end; background: #fff; color: var(--ink-900); border: 1px solid var(--border-soft); border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--ivory-100); color: var(--ink-800); border-bottom-left-radius: 4px; }
  .composer { border: 2px solid var(--cream-400); background: #fff; border-radius: var(--radius-lg); padding: 8px; display:flex; align-items:center; gap: 8px; box-shadow: var(--shadow-card); }
  .icon { width: 36px; height: 36px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; color: var(--ink-700); font-size: 18px; }
  .ph { flex: 1; font-size: 13px; color: var(--ivory-500); }
  .send { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--navy-700); color: #fff; display:flex; align-items:center; justify-content:center; }
  .send svg { width: 15px; height: 15px; }
</style>
</head>
<body>
  <div class="cap">AI chat — bubbles &amp; composer</div>
  <div class="msgs">
    <div class="b user">Generate an IEEE paper on sliding-mode control for a balancing robot.</div>
    <div class="b ai">Siap — saya susun draft lengkap (Intro, Methods, Results, Discussion) dengan 20+ referensi…</div>
  </div>
  <div class="composer">
    <div class="icon">💡</div>
    <div class="icon">＋</div>
    <div class="ph">Ketik pesan…</div>
    <div class="send"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg></div>
  </div>
</body>
</html>
