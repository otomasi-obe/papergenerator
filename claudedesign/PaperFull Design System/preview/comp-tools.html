<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-app); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 14px; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 13px; }
  .ic { width: 34px; height: 34px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; font-size: 17px; color:#fff; margin-bottom: 9px; }
  .card h3 { font-size: 13px; font-weight: 600; color: var(--fg-strong); margin: 0; }
</style>
</head>
<body>
  <div class="cap">AI tools suite</div>
  <div class="sub">Paraphrase · Translate · Humanize · check — each opens an input→output workspace</div>
  <div class="grid">
    <div class="card"><div class="ic" style="background:var(--navy-500)">✍️</div><h3>Paraphrase</h3></div>
    <div class="card"><div class="ic" style="background:var(--academic-conference)">🌐</div><h3>Translator</h3></div>
    <div class="card"><div class="ic" style="background:var(--accent-success)">🧬</div><h3>Humanizer</h3></div>
    <div class="card"><div class="ic" style="background:var(--gold-500)">🔍</div><h3>AI Detector</h3></div>
    <div class="card"><div class="ic" style="background:var(--accent-danger)">📋</div><h3>Plagiarism</h3></div>
    <div class="card"><div class="ic" style="background:var(--teal-accent)">✓</div><h3>Grammar</h3></div>
    <div class="card"><div class="ic" style="background:var(--navy-700)">📝</div><h3>Summarize</h3></div>
    <div class="card"><div class="ic" style="background:var(--gold-600)">📑</div><h3>Citation</h3></div>
  </div>
</body>
</html>
