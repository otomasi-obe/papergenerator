<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 16px; }
  .row { display:flex; gap: 22px; flex-wrap: wrap; align-items:flex-start; }
  .grp { }
  .grp .t { font-size: 10px; text-transform:uppercase; letter-spacing:.1em; color: var(--ink-500); margin-bottom: 9px; }
  .ic { display:flex; gap: 14px; color: var(--ink-700); align-items:center; }
  .ic svg { width: 22px; height: 22px; }
  .uni { display:flex; gap: 14px; font-size: 19px; color: var(--ink-700); }
</style>
</head>
<body>
  <div class="cap">Functional glyphs — Heroicons outline + Unicode</div>
  <div class="sub">In-repo SVGs are 24px · stroke 2 · currentColor. New icons → Heroicons outline.</div>
  <div class="row">
    <div class="grp">
      <div class="t">Inline SVG (Heroicons outline)</div>
      <div class="ic">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <svg fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </div>
      <div class="sub" style="margin:8px 0 0">bell · send · export · stop</div>
    </div>
    <div class="grp">
      <div class="t">Unicode UI glyphs</div>
      <div class="uni"><span>⠿</span><span>↶</span><span>↷</span><span>↻</span><span>＋</span><span>✕</span><span>✓</span><span>▾</span></div>
      <div class="sub" style="margin:8px 0 0">drag · undo · redo · retry · add · close · ok · disclosure</div>
    </div>
  </div>
</body>
</html>
