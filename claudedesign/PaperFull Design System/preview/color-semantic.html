<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { display:flex; align-items:baseline; gap:8px; margin: 0 0 14px; }
  .cap b { font-size: 14px; color: var(--fg-strong); font-weight: 700; }
  .cap span { font-size: 12px; color: var(--fg-muted); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tok { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-soft); }
  .chip { height: 54px; }
  .lbl { padding: 6px 8px; }
  .lbl .t { font-size: 11.5px; font-weight: 600; color: var(--fg-strong); }
  .lbl .h { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap"><b>Semantic accents</b><span>status, feedback &amp; the secondary editorial teal</span></div>
  <div class="grid">
    <div class="tok"><div class="chip" style="background:var(--accent-primary)"></div><div class="lbl"><div class="t">Link / Primary</div><div class="h">1265c8</div></div></div>
    <div class="tok"><div class="chip" style="background:var(--accent-success)"></div><div class="lbl"><div class="t">Success / Saved</div><div class="h">2f9d6e</div></div></div>
    <div class="tok"><div class="chip" style="background:var(--accent-warning)"></div><div class="lbl"><div class="t">Warning / Pending</div><div class="h">d9a718</div></div></div>
    <div class="tok"><div class="chip" style="background:var(--accent-danger)"></div><div class="lbl"><div class="t">Danger / Delete</div><div class="h">c43655</div></div></div>
    <div class="tok"><div class="chip" style="background:var(--teal-accent)"></div><div class="lbl"><div class="t">Teal · focus ring</div><div class="h">238f7f</div></div></div>
  </div>
</body>
</html>
