<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display:inline-flex; align-items:center; gap:8px; border:0; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 10px 18px; cursor: pointer; transition: all var(--t-fast); }
  .btn:active { transform: scale(.95); }
  .primary { background: var(--navy-700); color: var(--cream-50); box-shadow: var(--shadow-card); }
  .primary:hover { background: var(--navy-800); }
  .secondary { background: var(--cream-200); color: var(--ink-900); }
  .secondary:hover { background: var(--cream-300); }
  .ghost { background: transparent; color: var(--ink-700); }
  .ghost:hover { background: var(--cream-100); }
  .danger { background: var(--accent-danger); color: #fff; }
  .outline { background: transparent; color: var(--navy-500); border: 2px solid var(--navy-500); padding: 8px 16px; }
  .outline:hover { background: var(--navy-500); color: #fff; }
  .note { font-size: 11px; color: var(--fg-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="cap">Buttons</div>
  <div class="row">
    <button class="btn primary">＋ New Paper</button>
    <button class="btn secondary">Copy</button>
    <button class="btn ghost">↶ Undo</button>
    <button class="btn danger">Delete</button>
    <button class="btn outline">Learn More →</button>
  </div>
  <div class="note">Signature press = <code style="font-family:var(--font-mono)">active:scale-95</code> · hover = background-fill or border-warm, never inversion · dark mode primary flips to cream.</div>
</body>
</html>
