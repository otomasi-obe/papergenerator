<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 12px; }
  .bar { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; background: rgba(255,253,248,.95); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 8px 12px; }
  .back { font-size: 13px; color: var(--ink-700); }
  .div { color: var(--cream-400); }
  .title { font-size: 13px; font-weight: 500; color: var(--ink-900); }
  .saved { font-size: 11px; color: #1f7d54; }
  .grp { display:flex; gap: 4px; margin-left: auto; }
  .t { font-size: 12px; font-weight: 500; color: var(--ink-700); padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .t.active { background: var(--ivory-200); color: var(--ink-900); }
  .t:hover:not(.active) { background: var(--ivory-200); }
</style>
</head>
<body>
  <div class="cap">Editor toolbar &amp; tabs</div>
  <div class="bar">
    <span class="back">← Papers</span>
    <span class="div">|</span>
    <span class="title">Adaptive Sliding-Mode Control…</span>
    <span class="saved">Saved · just now</span>
    <div class="grp">
      <span class="t">📄 DOCX</span>
      <span class="t active">📝 Editor</span>
      <span class="t">📚 Journal</span>
      <span class="t">📖 Literatur</span>
      <span class="t">👁 Preview</span>
      <span class="t">💬 AI Chat</span>
    </div>
  </div>
</body>
</html>
