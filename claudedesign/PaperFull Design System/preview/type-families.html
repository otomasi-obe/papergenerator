<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); }
  .fam { padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  .fam:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-sans); font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .14em; margin-bottom: 4px; }
  .spec { color: var(--fg-strong); line-height: 1.2; }
</style>
</head>
<body>
  <div class="fam">
    <div class="meta">DM Sans · UI &amp; body</div>
    <div class="spec" style="font-family:var(--font-sans); font-size: 27px; font-weight: 600;">Generate papers in a single prompt</div>
  </div>
  <div class="fam">
    <div class="meta">Fraunces · serif headings (warm old-style)</div>
    <div class="spec" style="font-family:var(--font-serif); font-size: 28px; font-weight: 600; letter-spacing:-.01em;">Deep Learning for Text Synthesis</div>
  </div>
  <div class="fam">
    <div class="meta">JetBrains Mono · numerics &amp; code</div>
    <div class="spec" style="font-family:var(--font-mono); font-size: 22px; font-weight: 500;">1.2k / 50.0k tokens · IEEE</div>
  </div>
  <div class="fam">
    <div class="meta">Times New Roman · the exported paper (locked)</div>
    <div class="spec" style="font-family:var(--font-paper); font-size: 22px; font-weight: 700;">Abstract— This paper presents…</div>
  </div>
</body>
</html>
