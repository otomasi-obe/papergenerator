<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 22px 30px; background: var(--bg-app); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 20px; }
  .grid { display: flex; gap: 26px; }
  .item { text-align: center; }
  .box { width: 120px; height: 70px; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--fg-strong); margin-top: 14px; }
  .vl { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap">Elevation — restrained, warm-shadowed</div>
  <div class="grid">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="nm">card</div><div class="vl">default surface</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div><div class="vl">hover lift</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md · lg</div><div class="vl">menus, toasts</div></div>
    <div class="item"><div class="box" style="box-shadow:0 30px 60px -15px rgba(0,0,0,.6)"></div><div class="nm">hero</div><div class="vl">marketing image</div></div>
  </div>
</body>
</html>
