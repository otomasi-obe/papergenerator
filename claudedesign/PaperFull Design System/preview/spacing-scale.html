<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .bar { height: 16px; background: var(--gold-300); border-radius: 3px; }
  .nm { width: 42px; font-size: 11.5px; font-weight: 600; color: var(--fg-strong); }
  .vl { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="cap">Spacing scale · 4-based</div>
  <div class="row"><span class="nm">1</span><div class="bar" style="width:4px"></div><span class="vl">4px</span></div>
  <div class="row"><span class="nm">2</span><div class="bar" style="width:8px"></div><span class="vl">8px</span></div>
  <div class="row"><span class="nm">3</span><div class="bar" style="width:12px"></div><span class="vl">12px</span></div>
  <div class="row"><span class="nm">4</span><div class="bar" style="width:16px"></div><span class="vl">16px · card gap</span></div>
  <div class="row"><span class="nm">5</span><div class="bar" style="width:24px"></div><span class="vl">24px · section</span></div>
  <div class="row"><span class="nm">6</span><div class="bar" style="width:40px"></div><span class="vl">40px</span></div>
  <div class="row"><span class="nm">7</span><div class="bar" style="width:64px"></div><span class="vl">64px · page</span></div>
</body>
</html>
