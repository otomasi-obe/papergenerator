<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 0; font-family: var(--font-sans); display:flex; }
  .pane { flex: 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 12px; padding: 22px; }
  .light { background: var(--cream-50); }
  .dark { background: var(--ash-850); }
  .light .nm { color: var(--ink-700); }
  .dark .nm { color: var(--ink-200); }
  .nm { font-size: 11px; text-transform:uppercase; letter-spacing:.12em; }
  img { object-fit: contain; }
</style>
</head>
<body>
  <div class="pane light">
    <img src="../assets/logo-with-text.png" alt="PaperFull" style="height:76px" />
    <div class="nm">Wordmark · on cream</div>
  </div>
  <div class="pane dark">
    <img src="../assets/logo.png" alt="PaperFull mark" style="height:64px;border-radius:10px" />
    <div class="nm">Mark · on ash dark</div>
  </div>
</body>
</html>
