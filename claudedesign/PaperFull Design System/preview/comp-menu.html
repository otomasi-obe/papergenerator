<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-app); font-family: var(--font-sans); display:flex; gap: 22px; align-items:flex-start; }
  .menu { width: 224px; background: var(--cream-50); border: 1px solid var(--cream-300); border-radius: var(--radius-md); box-shadow: var(--shadow-md); overflow: hidden; }
  .hd { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  .hd .nm { font-size: 13px; font-weight: 600; color: var(--ink-900); }
  .hd .em { font-size: 11px; color: var(--ink-600); }
  .theme { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); }
  .theme .t { font-size: 10px; text-transform:uppercase; letter-spacing:.1em; color: var(--ink-500); font-weight:600; margin-bottom:6px; }
  .seg { display:grid; grid-template-columns: repeat(3,1fr); gap: 4px; background: var(--cream-100); padding: 4px; border-radius: var(--radius-sm); }
  .seg span { text-align:center; font-size: 11px; font-weight:500; padding: 5px 0; border-radius: 5px; color: var(--ink-600); }
  .seg .on { background: #fff; color: var(--ink-900); border: 1px solid var(--cream-300); }
  .it { display:flex; align-items:center; gap: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-800); }
  .it:hover { background: var(--cream-100); }
  .out { color: #a52d48; border-top: 1px solid var(--border-soft); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin: 0 0 12px; }
</style>
</head>
<body>
  <div>
    <div class="cap">User menu</div>
    <div class="menu">
      <div class="hd"><div class="nm">Rofiq P.</div><div class="em">rofiq@otomasi.app</div></div>
      <div class="theme">
        <div class="t">Theme</div>
        <div class="seg"><span class="on">☀️ Light</span><span>🌙 Dark</span><span>🖥️ System</span></div>
      </div>
      <div class="it">📄 My Papers</div>
      <div class="it">📊 Admin</div>
      <div class="it out">🚪 Sign Out</div>
    </div>
  </div>
</body>
</html>
