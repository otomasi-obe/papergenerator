<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); font-family: var(--font-sans); }
  .cap { font-size: 14px; color: var(--fg-strong); font-weight: 700; margin-bottom: 16px; }
  .row { display:flex; align-items:center; gap: 24px; flex-wrap: wrap; }
  .meter { display:inline-flex; align-items:center; gap: 9px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--cream-100); border: 1px solid var(--cream-300); }
  .track { width: 96px; height: 8px; border-radius: var(--radius-pill); background: var(--cream-300); overflow: hidden; }
  .fill { height: 100%; }
  .num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-700); }
  .lbl { font-size: 11px; color: var(--fg-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="cap">Token quota meter</div>
  <div class="row">
    <div>
      <div class="meter"><div class="track"><div class="fill" style="width:34%;background:var(--accent-success)"></div></div><span class="num">17.0k/50.0k</span></div>
      <div class="lbl">Healthy &lt; 70%</div>
    </div>
    <div>
      <div class="meter"><div class="track"><div class="fill" style="width:78%;background:var(--accent-warning)"></div></div><span class="num">39.0k/50.0k</span></div>
      <div class="lbl">Warning ≥ 70%</div>
    </div>
    <div>
      <div class="meter"><div class="track"><div class="fill" style="width:94%;background:#ef4444"></div></div><span class="num">47.0k/50.0k</span></div>
      <div class="lbl">Critical ≥ 90%</div>
    </div>
  </div>
</body>
</html>
