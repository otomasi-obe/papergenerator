openapi: "3.1.0"
info:
  title: PaperFull API
  description: |
    AI-powered academic paper generation API. Authentication via httpOnly cookies
    + double-submit CSRF token (X-CSRF-TOKEN header for state-changing requests).
  version: "1.1.0"
  contact:
    name: PaperFull
    url: https://paperfull.app
servers:
  - url: https://paperfull.app
    description: Production
  - url: http://localhost:8000
    description: Local proxy (frontend)
  - url: http://localhost:8001
    description: Local backend (direct)

tags:
  - name: Auth
    description: Login, register, OAuth, refresh, session
  - name: Papers
    description: Paper CRUD
  - name: Files
    description: PDF/DOCX/DOC/TXT/MD attachments
  - name: Images
    description: Paper image upload + signed URLs
  - name: Generation
    description: AI paper generation
  - name: Export
    description: DOCX export
  - name: Admin
    description: Admin-only endpoints (role=admin)
  - name: Chat
    description: Chat conversations & messages
  - name: Health
    description: Liveness/readiness probes
  - name: Metrics
    description: Prometheus exposition

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, model]
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  model: { type: string, example: gpt-5-mini-2025-08-07 }

  /api/healthz:
    get:
      tags: [Health]
      summary: Readiness probe (DB + disk)
      operationId: healthz
      security: []
      responses:
        "200":
          description: All checks passing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDetail" }
        "503":
          description: One or more dependency checks failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDetail" }

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Must include 3 of [lowercase, uppercase, digit, symbol].
      responses:
        "201":
          description: Created. Sets httpOnly access + refresh cookies.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Email/password login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK. Sets httpOnly access + refresh cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/google/login:
    get:
      tags: [Auth]
      summary: Redirect to Google OAuth consent screen
      operationId: googleLogin
      security: []
      responses:
        "302":
          description: Redirect to Google.
        "503":
          description: Google OAuth not configured.

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access + refresh tokens
      operationId: refresh
      description: |
        Uses the `refresh_token_cookie`. Issues a new access cookie and rotates
        the refresh cookie. CSRF: requires `X-CSRF-TOKEN` matching the
        `csrf_refresh_token` cookie.
      responses:
        "200":
          description: New cookies set; user payload returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getMe
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear auth cookies
      operationId: logout
      security: []
      responses:
        "200":
          description: Cookies cleared.

  /api/papers:
    get:
      tags: [Papers]
      summary: List papers (paginated)
      operationId: listPapers
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated list.
          content:
            application/json:
              schema:
                type: object
                required: [papers, pagination]
                properties:
                  papers:
                    type: array
                    items: { $ref: "#/components/schemas/PaperSummary" }
                  pagination: { $ref: "#/components/schemas/OffsetPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Papers]
      summary: Create or upsert a paper
      operationId: savePaper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
                title: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: string }
                  paper: { $ref: "#/components/schemas/PaperSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/papers/{paper_id}:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    get:
      tags: [Papers]
      summary: Load full paper data
      operationId: getPaper
      responses:
        "200":
          description: Full paper data (data fields merged at top level).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Papers]
      summary: Update a paper
      operationId: updatePaper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated.
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Papers]
      summary: Delete a paper and all its dependents
      operationId: deletePaper
      responses:
        "200":
          description: Deleted.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/papers/{paper_id}/files:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    get:
      tags: [Files]
      summary: List paper files
      operationId: listPaperFiles
      responses:
        "200":
          description: List of files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/PaperFile" }
    post:
      tags: [Files]
      summary: Upload one or more files (PDF/DOCX/DOC/TXT/MD, ≤10MB each)
      operationId: uploadPaperFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Uploaded.

  /api/papers/{paper_id}/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/PaperId"
      - name: file_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Files]
      summary: Delete a paper file
      operationId: deletePaperFile
      responses:
        "200":
          description: Deleted.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/papers/{paper_id}/files/{file_id}/raw:
    parameters:
      - $ref: "#/components/parameters/PaperId"
      - name: file_id
        in: path
        required: true
        schema: { type: integer }
      - name: s
        in: query
        description: HMAC-signed token (preferred for `<a>`/`<iframe>`).
        schema: { type: string }
      - name: t
        in: query
        description: Legacy JWT (deprecated).
        schema: { type: string }
    get:
      tags: [Files]
      summary: Download / inline-view raw file
      operationId: serveRawFile
      security:
        - {}              # signed token via ?s=
        - cookieAuth: []
      responses:
        "200":
          description: File body.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/papers/{paper_id}/files/{file_id}/preview:
    parameters:
      - $ref: "#/components/parameters/PaperId"
      - name: file_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Files]
      summary: Cached extracted preview text
      operationId: previewFile
      responses:
        "200":
          description: Preview text + raw URL.

  /api/papers/{paper_id}/images:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    get:
      tags: [Images]
      summary: List paper images
      operationId: listPaperImages
      responses:
        "200":
          description: List of images.
    post:
      tags: [Images]
      summary: Upload a single image (PNG/JPG/GIF/BMP/WEBP, magic-byte verified)
      operationId: uploadPaperImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_id: { type: integer }
                  url: { type: string }
                  filename: { type: string }
        "400":
          description: Bad request (invalid file format or missing file)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Payload too large (file size exceeds limit)
        "415":
          description: Unsupported media type (not PNG/JPG/GIF/BMP/WEBP)

  /api/papers/{paper_id}/images/{image_id}:
    parameters:
      - $ref: "#/components/parameters/PaperId"
      - name: image_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Images]
      summary: Delete an image
      operationId: deletePaperImage
      responses:
        "204":
          description: Image deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Image not found

  /api/papers/{paper_id}/sign:
    parameters:
      - $ref: "#/components/parameters/PaperId"
    post:
      tags: [Images]
      summary: Mint a short-lived signed URL for an image or file
      operationId: signResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, resource_id]
              properties:
                scope: { type: string, enum: [image, file] }
                resource_id:
                  oneOf:
                    - { type: string }
                    - { type: integer }
                ttl_seconds: { type: integer, minimum: 60, maximum: 3600, default: 600 }
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_in: { type: integer }

  /api/images/{paper_id}/{filename}:
    parameters:
      - $ref: "#/components/parameters/PaperId"
      - name: filename
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
      - name: s
        in: query
        schema: { type: string }
      - name: t
        in: query
        schema: { type: string }
    get:
      tags: [Images]
      summary: Serve image bytes
      operationId: getImage
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: Image file bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Image not found

  /api/generate:
    post:
      tags: [Generation]
      summary: Generate a single section
      operationId: generateSection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: The generation prompt
                lastText:
                  type: string
                  description: Previous text for context continuity
                paperContext:
                  type: object
                  additionalProperties: true
                  description: Paper metadata and context
                section:
                  type: string
                  description: Target section (abstract, introduction, etc.)
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  section: { type: string }
        "400":
          description: Bad request (missing prompt or invalid JSON)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Rate limit exceeded (20 per minute)
        "500":
          description: Server error (API key not configured)

  /api/generate-full:
    post:
      tags: [Generation]
      summary: Start a full-paper generation job (async)
      operationId: generateFull
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: The paper generation prompt
                topic:
                  type: string
                  description: Paper topic/subject
                style:
                  type: string
                  description: Writing style preference
      responses:
        "202":
          description: Job accepted; poll /api/job/{job_id}.

  /api/job/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Generation]
      summary: Job status
      operationId: getJob
      responses:
        "200":
          description: Job status and result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, done, error]
                  elapsed:
                    type: integer
                    description: Elapsed time in seconds
                  result:
                    type: object
                    description: Job result (when status is done)
                  error:
                    type: string
                    description: Error message (when status is error)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found or already retrieved

  /api/topics:
    get:
      tags: [Generation]
      summary: List available topics
      operationId: listTopics
      responses:
        "200":
          description: List of available topics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/styles:
    get:
      tags: [Generation]
      summary: List available styles
      operationId: listStyles
      responses:
        "200":
          description: List of available writing styles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/journals:
    get:
      tags: [Export]
      summary: List available journal templates
      operationId: listJournals
      responses:
        "200":
          description: List of available journals with metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: Journal code identifier
                    name:
                      type: string
                      description: Journal full name
                    format:
                      type: object
                      description: Formatting requirements
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/export:
    post:
      tags: [Export]
      summary: Export paper as DOCX
      operationId: exportDocx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paper]
              properties:
                paper:
                  type: object
                  additionalProperties: true
                  description: Paper data to export
                journal:
                  type: string
                  description: Journal code for formatting
      responses:
        "200":
          description: DOCX file generated successfully
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "400":
          description: Bad request (missing paper data)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      operationId: adminListUsers
      responses:
        "200":
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
                    email:
                      type: string
                    is_admin:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (admin access required)

  /api/admin/papers:
    get:
      tags: [Admin]
      summary: List all papers across users
      operationId: adminListPapers
      responses:
        "200":
          description: List of all papers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    user_id:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
                    status:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (admin access required)

  /api/admin/usage:
    get:
      tags: [Admin]
      summary: API token usage stats
      operationId: adminUsage
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  total_papers:
                    type: integer
                  total_generations:
                    type: integer
                  api_calls_today:
                    type: integer
                  storage_used_mb:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (admin access required)

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Summary counts
      operationId: adminStats
      responses:
        "200":
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_seconds:
                    type: integer
                  active_users:
                    type: integer
                  queue_length:
                    type: integer
                  cache_hit_rate:
                    type: number
                  avg_response_time_ms:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden (admin access required)

components:
  parameters:
    PaperId:
      name: paper_id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }

  schemas:
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: string, nullable: true }
        role: { type: string, enum: [user, admin] }
        created_at: { type: string, format: date-time }
        last_login: { type: string, format: date-time, nullable: true }

    PaperSummary:
      type: object
      required: [id, title, user_id]
      properties:
        id: { type: string }
        title: { type: string }
        user_id: { type: integer }
        image_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaperFile:
      type: object
      properties:
        id: { type: integer }
        paper_id: { type: string }
        filename: { type: string }
        original_name: { type: string }
        ext: { type: string, enum: [.pdf, .docx, .doc, .txt, .md] }
        size_bytes: { type: integer }
        url: { type: string }
        preview_url: { type: string }
        created_at: { type: string, format: date-time }

    OffsetPage:
      type: object
      required: [limit, offset, total, has_more]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
        has_more: { type: boolean }

    HealthDetail:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            db:
              type: object
              properties:
                ok: { type: boolean }
                error: { type: string }
            disk:
              type: object
              properties:
                ok: { type: boolean }
                free_mb: { type: integer }
                min_required_mb: { type: integer }

    Problem:
      type: object
      required: [type, title, status]
      description: RFC 7807 Problem Details
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        instance: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Conflict:
      description: Conflicting state (eg. email exists)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token_cookie
      description: |
        httpOnly access cookie. CSRF protection: include the value of the
        `csrf_access_token` cookie as the `X-CSRF-TOKEN` header on all
        state-changing requests (POST/PUT/PATCH/DELETE).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Legacy header-based auth (still accepted as fallback).

security:
  - cookieAuth: []
  - bearerAuth: []
