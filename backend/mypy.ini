[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
show_error_codes = True
pretty = True

[mypy-tests.*]
ignore_errors = True

[mypy-database.alembic.*]
ignore_errors = True

[mypy-*.migrations.*]
ignore_errors = True
