# Logrotate config untuk gunicorn logs PaperGenerator.
# Path log: /home/sirobo/papergenerator/backend/logs/gunicorn-*.log
# Cara pakai (sebagai user sirobo):
#   logrotate -s /home/sirobo/papergenerator/backend/logs/logrotate.state /home/sirobo/papergenerator/backend/logrotate.conf
# Untuk cron (opsional — jalankan manual dulu):
#   ln -s /home/sirobo/papergenerator/backend/logrotate.conf /home/sirobo/.config/logrotate/papergenerator.conf
#   Lalu jalankan logrotate via cron user.

/home/sirobo/papergenerator/backend/logs/gunicorn-access.log
/home/sirobo/papergenerator/backend/logs/gunicorn-error.log {
    daily
    rotate 7
    compress
    missingok
    copytruncate
    dateext
    dateformat -%Y%m%d
    notifempty
}